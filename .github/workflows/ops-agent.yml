name: Ops Agent Routine

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  run-routine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run routine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --bare -p "$(cat ROUTINE_PROMPT.md)" \
            --allowedTools "Bash,Read,Grep,Glob" \
            --permission-mode dontAsk \
            --output-format json > routine-output.json
          cat routine-output.json

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routine-output-${{ github.run_id }}
          path: routine-output.json
