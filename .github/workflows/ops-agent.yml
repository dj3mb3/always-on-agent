name: Ops Agent Routine

on:
  schedule:
    # GitHub docs note 5 minutes as the practical floor for scheduled
    # workflows; sub-5-minute crons may be throttled/coalesced on their end.
    - cron: "*/2 * * * *"
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

# The routine's idempotency check (does this issue already have a marker
# comment/label?) is check-then-act, which is not safe against two runs
# executing at the same time — e.g. a scheduled fire overlapping a manual
# "Run now" from the dashboard. This serializes runs: only one executes at
# once, and if multiple triggers queue up while it's running, only the most
# recent queued one survives (GitHub cancels older pending runs in the same
# group), so triggers don't pile up unboundedly.
concurrency:
  group: ops-agent-routine
  cancel-in-progress: false

jobs:
  run-routine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run routine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --bare -p "$(cat ROUTINE_PROMPT.md)" \
            --allowedTools "Bash,Read,Grep,Glob" \
            --permission-mode dontAsk \
            --output-format json > routine-output.json
          cat routine-output.json

      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routine-output-${{ github.run_id }}
          path: routine-output.json
